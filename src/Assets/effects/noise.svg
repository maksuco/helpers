<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <filter id="monoNoise">
    <!-- 1. Generate standard turbulence -->
    <feTurbulence 
      type="fractalNoise" 
      baseFrequency="0.8" 
      numOctaves="3" 
      stitchTiles="stitch" 
      result="colorNoise" />

    <!-- 2. Strip color channels to force black & white / grayscale -->
    <feColorMatrix 
      type="saturate" 
      values="0" 
      in="colorNoise" />
  </filter>
  
  <rect width="100%" height="100%" filter="url(#monoNoise)" />
</svg>
